[platformio]
default_envs = 04_final_combined

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6

; PlatformIO sidebar: simple DHT readings for the serial/CSV lesson.
[env:01_dht_serial]
board_build.partitions = partitions.csv
build_src_filter =
    -<*>
    +<stages/01_dht_serial.cpp>

; PlatformIO sidebar: DHT readings stored in a teaching LittleFS CSV.
[env:02_flash_storage]
board_build.partitions = firmware/02_flash_storage/partitions.csv
build_src_filter =
    -<*>
    +<stages/02_flash_storage.cpp>

; PlatformIO sidebar: ten-reading neural-network inference and voting.
[env:03_tinyml_inference]
board_build.partitions = partitions.csv
build_flags = -Iinclude
build_src_filter =
    -<*>
    +<stages/03_tinyml_inference.cpp>

; PlatformIO sidebar: final flash-ring logger plus TinyML inference.
[env:04_final_combined]
board_build.partitions = partitions.csv
build_src_filter =
    -<*>
    +<main.cpp>
